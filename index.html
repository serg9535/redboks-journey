<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Redbok's Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1b1530;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* position:fixed + inset:0 sizes #app directly off the viewport, not off
         an html/body height:100% percentage chain — mobile browsers resize
         the viewport (address bar show/hide) in ways that make % chains
         unreliable for Phaser's initial FIT-scale measurement.
         Phaser's Scale Manager (autoCenter: CENTER_BOTH) positions the canvas
         itself via inline margins — do not also center #app with flex/grid,
         the two centering mechanisms stack and misplace the canvas. */
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
